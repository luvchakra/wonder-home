name: Supply chain

# Dependency audit, SBOM, secret scan of git history, CodeQL. GitHub Actions
# only, never a deploy (CLAUDE.md, build-slot budget). docs/security/supply-chain.md
# says what blocks and how to triage.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * 1" # weekly, Tuesday 02:47 IST

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Blocking: a new high/critical production advisory not in the baseline.
      # Report-only: dev-only and moderate-or-lower advisories.
      - name: Dependency audit
        run: node scripts/audit-gate.mjs
      # The SBOM needs the installed tree.
      - run: npm ci --ignore-scripts
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-reports
          path: |
            sbom.cdx.json
            audit.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      # Blocking. Reads .gitleaks.toml; the action needs no licence for a
      # repository owned by a personal account.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Report-only: findings go to the Security tab, nothing here blocks.
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: /language:javascript-typescript
