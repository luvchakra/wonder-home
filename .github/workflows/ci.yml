name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, not secrets. The build and the E2E smoke run against no
  # real project: with no session cookie, Supabase reports a missing session
  # locally, so /api/v1/me answers 401 without ever reaching this host.
  # Stories that need a live database bring their own service container.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key

jobs:
  # Fast, no database needed: types, static analysis, and unit tests.
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: PostgREST embed lint
        run: npm run lint:embeds

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Secret lint
        run: npm run lint:secrets

      - name: Progress tracker is current
        run: npm run tracker -- --check

      - name: Brand assets match the mark
        run: npm run brand -- --check

      - name: P0 security suite
        run: npm run security

      - name: Unit tests
        run: npm run test

  # The only job that needs a real database: schema and RLS authorization tests.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Schema and authorization tests
        run: npm run test:db

  # Build and browser smoke tests run against the placeholder project, no
  # database needed.
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A single required check name for branch protection, whatever the jobs
  # above are split into.
  ci:
    if: always()
    needs: [lint-and-unit, db-tests, build-and-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.lint-and-unit.result }}" != "success" ] || \
             [ "${{ needs.db-tests.result }}" != "success" ] || \
             [ "${{ needs.build-and-e2e.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
