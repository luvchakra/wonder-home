name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, not secrets. The build and the E2E smoke run against no
  # real project: with no session cookie, Supabase reports a missing session
  # locally, so /api/v1/me answers 401 without ever reaching this host.
  # Stories that need a live database bring their own service container.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key

jobs:
  # Fast, no database needed: types and static analysis. Unit tests are a
  # separate job (below) so a typo eslint would catch in seconds doesn't sit
  # behind the ~1300-test unit suite before this job can report red.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # npm ci deletes node_modules before it installs, so caching it
      # alongside an unconditional `npm ci` buys nothing — this only helps
      # because the install is skipped outright on a cache hit. Safe exactly
      # because npm ci's own guarantee is a reproducible install from the
      # lockfile: an exact lockfile-hash match means the restored
      # node_modules is what `npm ci` would have produced anyway.
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration schema lint
        run: npm run lint:migrations

      - name: PostgREST embed lint
        run: npm run lint:embeds

      - name: Import boundary lint
        run: npm run lint:boundaries

      - name: Secret lint
        run: npm run lint:secrets

      - name: Progress tracker is current
        run: npm run tracker -- --check

      - name: Brand assets match the mark
        run: npm run brand -- --check

      - name: P0 security suite
        run: npm run security

  # The ~1300-test unit suite, split out so it runs in parallel with lint
  # and db-tests rather than behind lint's fast static checks.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit tests
        run: npm run test

  # The only job that needs a real database: schema and RLS authorization tests.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Schema and authorization tests
        run: npm run test:db

  # Build and browser smoke tests run against the placeholder project, no
  # database needed.
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Chromium's binary is a ~150MB download; the browser itself doesn't
      # change between runs unless @playwright/test's version does, so this
      # is the one part of the install worth caching. The OS-level packages
      # `--with-deps` also installs still run every time — the runner VM is
      # thrown away after each job, so there is nothing to cache them into.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        # The Build step above already produced apps/web/.next — without this,
        # playwright.config.ts's webServer command rebuilds the whole app a
        # second time before starting the server.
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A single required check name for branch protection, whatever the jobs
  # above are split into.
  ci:
    if: always()
    needs: [lint, unit-tests, db-tests, build-and-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.db-tests.result }}" != "success" ] || \
             [ "${{ needs.build-and-e2e.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
