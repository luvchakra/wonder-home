name: CI

# Fast checks for every pull request and every push to main. The full
# browser suite runs nightly instead (.github/workflows/e2e-nightly.yml);
# docs/CI.md says what runs where, and why.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, not secrets. The build runs against no real project.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key

jobs:
  # What this change touches (scripts/ci-scope.mjs). A push to main, or a
  # pull request touching dependencies, TypeScript, test, lint or build
  # config, or CI itself, is `full`: every unit test and the whole lint.
  # Otherwise a pull request lints only the app files it changed and runs
  # only the unit tests related to the core files it changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      code: ${{ steps.scope.outputs.code }}
      unit: ${{ steps.scope.outputs.unit }}
      db: ${{ steps.scope.outputs.db }}
      web: ${{ steps.scope.outputs.web }}
      lint_files: ${{ steps.scope.outputs.lint_files }}
      test_files: ${{ steps.scope.outputs.test_files }}
      script_tests: ${{ steps.scope.outputs.script_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        run: node scripts/ci-scope.mjs "${{ github.event_name }}" "${{ github.event.pull_request.base.sha }}"

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # npm ci deletes node_modules before installing, so the cache only
      # helps because the install is skipped outright on an exact
      # lockfile-hash hit — which is what `npm ci` would produce anyway.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # tsc's incremental build info: warm, a typecheck re-checks only what
      # changed and what depends on it. Pull requests restore main's; only
      # main saves.
      - name: Restore typecheck cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/web/tsconfig.tsbuildinfo
            packages/core/tsconfig.tsbuildinfo
          key: tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Save typecheck cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/web/tsconfig.tsbuildinfo
            packages/core/tsconfig.tsbuildinfo
          key: tsc-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  # ESLint on the changed app files (the whole app on a full run), plus the
  # repository's own static lints, which are whole-repo by nature and take
  # about a second together.
  lint:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
      FULL: ${{ needs.changes.outputs.full }}
      LINT_FILES: ${{ needs.changes.outputs.lint_files }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore ESLint cache
        if: env.CODE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: ESLint (whole app)
        if: env.CODE == 'true' && env.FULL == 'true'
        run: npm run lint

      - name: ESLint (changed files)
        if: env.CODE == 'true' && env.FULL != 'true' && env.LINT_FILES != ''
        working-directory: apps/web
        run: npx eslint --cache --cache-strategy content --cache-location .eslintcache $LINT_FILES

      - name: Save ESLint cache
        if: env.CODE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: apps/web/.eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Migration schema lint
        if: env.CODE == 'true'
        run: npm run lint:migrations

      - name: PostgREST embed lint
        if: env.CODE == 'true'
        run: npm run lint:embeds

      # Every household table is known to HomeTalk, or excluded with a reason (the record index).
      - name: Knowledge registry lint
        if: env.CODE == 'true'
        run: npm run lint:knowledge

      - name: Import boundary lint
        if: env.CODE == 'true'
        run: npm run lint:boundaries

      # Every route handler and Server Action that reads input parses it with a schema (SEC-03).
      - name: Input boundary lint
        if: env.CODE == 'true'
        run: npm run lint:boundaries:input

      # The service role is reached through adminClientFor(grant), or from a file on the documented RLS-bypass list (SEC-04).
      - name: Service-role lint
        if: env.CODE == 'true'
        run: npm run lint:service-role

      # The user guide never links to a page or a section that is gone.
      - name: Help links resolve
        if: env.CODE == 'true'
        run: npm run lint:help-links

      - name: Progress tracker is current
        run: npm run tracker -- --check

      - name: Brand assets match the mark
        if: env.CODE == 'true'
        run: npm run brand -- --check

  # Unit tests related to what changed, or all of them on a full run.
  unit-tests:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.changes.outputs.full }}
      TEST_FILES: ${{ needs.changes.outputs.test_files }}
      SCRIPT_TESTS: ${{ needs.changes.outputs.script_tests }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit tests (all)
        if: env.FULL == 'true'
        run: npm run test

      # Every unit test lives in packages/core; apps/web has none, and core
      # tests never import the app, so a change to apps/web alone relates to
      # no unit test (typecheck and lint still cover it).
      - name: Unit tests related to the changed core files
        if: env.FULL != 'true' && env.TEST_FILES != ''
        working-directory: packages/core
        run: npx vitest related $TEST_FILES --run --passWithNoTests

      - name: Script tests
        if: env.FULL != 'true' && env.SCRIPT_TESTS == 'true'
        run: npm run test:scripts

  # The secret scan and the release gates that cost seconds: the P0
  # security suite and the deterministic AI evaluation (an Unsafe Action
  # Rate above zero fails here, per CLAUDE.md). The repo has no dependency
  # audit; none is added here.
  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Secret scan
        run: npm run lint:secrets

      - name: P0 security suite
        run: npm run security

      - name: AI evaluation — golden households, release gates
        run: npm run eval

  # Schema and RLS authorization tests: P0 release blockers, so they stay on
  # every pull request that touches migrations or the tests themselves.
  db-tests:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    # Two shards, each with its own server and template.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # The runner image ships PostgreSQL 16, stopped; starting it takes
      # about two seconds. pgvector is added so HomeBrain's meaning (the
      # hosted project has it) is tested as it runs there; without it the
      # migration still applies and that one test skips.
      - name: Start PostgreSQL
        run: |
          sudo apt-get install -y -q postgresql-16-pgvector >/dev/null 2>&1 || (sudo apt-get update -q >/dev/null 2>&1 && sudo apt-get install -y -q postgresql-16-pgvector >/dev/null 2>&1) || echo "pgvector not installed; its test will skip"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"

      - name: Schema and authorization tests (shard ${{ matrix.shard }} of 2)
        run: |
          node scripts/setup-test-db.mjs --template
          files=$(ls scripts/test-*-rls.mjs | awk -v n=${{ matrix.shard }} '(NR - 1) % 2 == n - 1')
          echo "$files"
          node --test --test-concurrency=4 $files

  # PERF-15: the hot reads' plans and buffer counts against
  # perf/query-budget.json, on the same local database the RLS tests use.
  query-budget:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"

      - name: Hot reads within query budget
        run: npm run budget:queries

  # The production build Vercel will run, so a change that cannot build never
  # merges and never spends a deployment slot failing. No browser tests.
  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Turbopack's build cache: warm, a build takes seconds. Pull requests
      # restore main's; only main saves.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # The user guide is for signed-in members, and everything under
      # /_next/static can be downloaded signed out.
      - name: User guide stays out of client JavaScript
        run: npm run check:bundle

      # PERF-16: first-load JS per route against perf/bundle-budget.json,
      # read from this same build. docs/performance-budgets.md.
      - name: First-load JS within budget
        run: npm run budget:bundle

      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  # A single required check name for branch protection, whatever the jobs
  # above are split into.
  ci:
    if: always()
    needs: [changes, typecheck, lint, unit-tests, security, db-tests, query-budget, build]
    runs-on: ubuntu-latest
    steps:
      # A job skipped because its area did not change is a pass; one skipped
      # because `changes` itself failed is not, so `changes` must succeed.
      - name: Require every job to have succeeded or been skipped on purpose
        run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          if [ "${{ needs.changes.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             ! ok "${{ needs.typecheck.result }}" || \
             ! ok "${{ needs.unit-tests.result }}" || \
             ! ok "${{ needs.security.result }}" || \
             ! ok "${{ needs.db-tests.result }}" || \
             ! ok "${{ needs.query-budget.result }}" || \
             ! ok "${{ needs.build.result }}"; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
