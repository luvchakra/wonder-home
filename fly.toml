# Fly config for the WonderHome portal fetch worker (story 08-033).
# This runs apps/portal-worker (headless Playwright), NOT the Next.js web app
# (that runs on Vercel). See https://fly.io/docs/reference/configuration/

# Singapore (sin) — nearest region available on this account to Supabase (ap-south-1, Mumbai).
app = 'wonder-home'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
